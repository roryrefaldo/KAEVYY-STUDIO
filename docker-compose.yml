version: '3.8'

services:
  # =========================================================
  # KAEVY Application Runtime
  # =========================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kaevy_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=postgres://kaevy_user:kaevy_secure_pass@postgres:5432/kaevy_studio_db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=production_super_secret_jwt_key_kaevy_studio_2026
      - CORS_ORIGIN=http://localhost,http://localhost:3000,https://kaevy.studio
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kaevy_network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # =========================================================
  # Primary PostgreSQL Relational Database
  # =========================================================
  postgres:
    image: postgres:16-alpine
    container_name: kaevy_postgres
    restart: always
    environment:
      POSTGRES_USER: kaevy_user
      POSTGRES_PASSWORD: kaevy_secure_pass
      POSTGRES_DB: kaevy_studio_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kaevy_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaevy_user -d kaevy_studio_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =========================================================
  # Redis Real-Time Socket & Caching Broker
  # =========================================================
  redis:
    image: redis:7-alpine
    container_name: kaevy_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - kaevy_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # =========================================================
  # Reverse Proxy & Edge Web Server (Nginx)
  # =========================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: kaevy_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - kaevy_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  kaevy_network:
    driver: bridge

version: '3.8'

services:
  app:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.dev
    container_name: kaevy_app_dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=postgres://kaevy_user:kaevy_secure_pass@postgres:5432/kaevy_studio_db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ../..:/app
      - /app/node_modules
    depends_on:
      - postgres
      - redis
    networks:
      - kaevy_dev_network

  postgres:
    image: postgres:16-alpine
    container_name: kaevy_postgres_dev
    environment:
      POSTGRES_USER: kaevy_user
      POSTGRES_PASSWORD: kaevy_secure_pass
      POSTGRES_DB: kaevy_studio_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - kaevy_dev_network

  redis:
    image: redis:7-alpine
    container_name: kaevy_redis_dev
    ports:
      - "6379:6379"
    networks:
      - kaevy_dev_network

volumes:
  postgres_dev_data:

networks:
  kaevy_dev_network:
    driver: bridge
